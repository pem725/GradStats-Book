project:
  type: book
  output-dir: _book

book:
  title: "Statistics by Us for You"
  author: "Patrick E. McKnight, Simone C. McKnight, Jeffrey Stuewig, and Todd B. Kashdan"
  date: last-modified
  date-format: long
  chapters:
    - index.qmd
    - foreword.qmd
    - preface.qmd
    - author.qmd
    - intro.qmd
    - part: "The Basics"
      chapters:
        - 02-distributions.qmd
        - 03-CTmeasures.qmd
        - 04-Dmeasures.qmd
        - 05-datacleaning.qmd
    - part: "Making Inferences with Data"
      chapters:
        - 06-zdistribution.qmd
        - 07-covariance.qmd
        - 08-hypothesistesting.qmd
        - 09-statisticalpower.qmd
    - part: "Checking Our Data"
      chapters:
        - 10-reliability.qmd
        - 11-validity.qmd
        - 18-rasch.qmd
    - part: "Preparing Our Data"
      chapters:
        - 31-datareduction.qmd
    - part: "Using Models"
      chapters:
        - 12-GLMcovariance.qmd
        - 13-pointbiserialcorrelation.qmd
        - 14-bivariateregression.qmd
        - 15-MRC.qmd
        - 16-ANOVAandGLM.qmd
        - 17-basicANOVA.qmd
        - 19-coding.qmd
    - part: "Latent Variable Models"
      chapters:
        - 28-sem.qmd
        - 32-invariance.qmd
        - 29-latentclass.qmd
        - 30-irt.qmd
    - part: "Beyond the Normal Curve"
      chapters:
        - 20-beyond.qmd
    - part: "Displaying Data"
      chapters:
        - 21-graphics.qmd
        - 22-tables.qmd
    - part: "Statistics in the Wild"
      chapters:
        - 23-sportspage.qmd
        - 24-casestudy-depression.qmd
        - 25-casestudy-curiosity.qmd
        - 26-casestudy-missing.qmd
    - part: "The Methods in Practice"
      chapters:
        - 27-methods-showcase.qmd
    - references.qmd
  cover-image: img/MRES2wbg.png
  repo-url: https://github.com/pem725/GradStats-Book
  repo-branch: main
      
bibliography: [statbook.bib, packages.bib, Methods.bib, PSYC643.bib, Rasch.bib, mcknight-pubs.bib]
biblio-style: apalike

format:
  html:
    # Light/dark toggle (a switch appears in the navbar). Dark is listed first,
    # so it is the default; readers can flip to the light (flatly) theme.
    # brand.scss layers shared figure/table polish on top of both.
    theme:
      light: [flatly, brand.scss]
      dark: [darkly, brand.scss]
    highlight-style: pygments
    df-print: kable          # render data.frame output as tidy tables, not raw text
    # Make the upper-left book title link to index.html (works over file:// too).
    include-after-body: _includes/home-link.html

link-citations: true
github-repo: pem725/GradStats-Book
description: "A comprehensive graduate statistics book suitable for social and behavioral sciences. Our approach is to provide interested students a gentle guide to the rudiments of statistical estimation and inference."
twitter-handle: pem725
cover-image: img/MRES2wbg.png
colorlinks: true
graphics: true