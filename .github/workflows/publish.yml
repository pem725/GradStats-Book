name: Render and Publish Book

# Renders the Quarto book and publishes it to GitHub Pages (gh-pages branch)
# on every push to main. You can also trigger it manually from the Actions tab.
#
# ONE-TIME SETUP (in the GitHub repo, only needed once):
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch"
#   Branch: gh-pages  /  (root)
# The site then lives at https://pem725.github.io/GradStats-Book/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # --- The other three languages -------------------------------------
      # Every code tab in this book is meant to RUN, not just be displayed.
      # Without these steps the SPSS, Julia and Python tabs degrade to static
      # text (see _engines.R), which is safe but is not the book.
      #
      # pspp   runs the SPSS syntax.
      # poppler-utils supplies pdftoppm, which turns PSPP's chart pages into
      #        images - PSPP's own png output is too coarse and its svg output
      #        draws charts on top of tables.
      # libmagick++-dev is what the R magick package builds against; magick
      #        trims those chart pages and finds the chart on them.
      - name: Install system tools for the SPSS tabs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pspp poppler-utils libmagick++-dev libpng-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::bookdown
            any::tidyverse
            any::broom
            any::plotly
            any::png
            any::magick

      # Ubuntu runners already carry a Julia binary, which is exactly how the
      # published book once ended up showing readers "Segmentation fault (core
      # dumped)": the binary was found, the packages were not there, and the
      # crash was captured as output. Instantiating the committed Manifest is
      # what makes that Julia usable.
      # Pinned to the version recorded in Manifest.toml (julia_version). A
      # newer Julia can refuse a manifest it did not write, and a failed
      # instantiate would put every Julia tab back to static text.
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.5'

      - name: Instantiate the book's Julia project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # _engines.R deliberately insists on .venv/bin/python rather than
      # whatever python3 is on PATH, so the environment the book runs against
      # is the same one described in the appendix.
      - name: Build the book's Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # Prove the three toolchains work BEFORE the render, using the very same
      # probes _engines.R uses. When a language silently falls back to static
      # text, this step is what says whether the toolchain was broken or the
      # render environment differed from the one we just built.
      - name: Verify the toolchains the book needs
        run: |
          echo "--- where are we ---"; pwd; ls -d .venv Project.toml Manifest.toml
          echo "--- pspp ---";   pspp --version | head -1
          echo "--- pdftoppm ---"; pdftoppm -v 2>&1 | head -1
          echo "--- python ---"; .venv/bin/python -c 'import pandas, matplotlib; print("BOOK_OK", pandas.__version__)'
          echo "--- julia ---";  julia --project=. --startup-file=no -e 'using CSV, DataFrames; print("BOOK_OK ")'
          echo
          echo "--- exactly what the engines will decide ---"
          echo "shell LD_LIBRARY_PATH: [${LD_LIBRARY_PATH:-unset}]"
          Rscript -e '
            cat("R LD_LIBRARY_PATH:", Sys.getenv("LD_LIBRARY_PATH", "unset"), "\n")'
          Rscript -e '
            suppressMessages(library(knitr)); e <- new.env(); sys.source("_engines.R", envir = e)
            jl <- e$.book_works("julia","julia", c("--project=.","--startup-file=no","-e",
                    shQuote("using CSV, DataFrames; print(\"BOOK_OK\")")))
            py <- e$.book_works("python", file.path(getwd(),".venv/bin/python"),
                    c("-c", shQuote("import pandas, matplotlib; print(\"BOOK_OK\")")))
            cat("julia usable :", jl, "|", attr(jl,"why"), "\n")
            cat("python usable:", py, "|", attr(py,"why"), "\n")
            if (!jl || !py) quit(status = 1)'

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
